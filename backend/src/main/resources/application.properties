# ─── Datasource ───────────────────────────────────────────────────────────────
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=hangouthub
quarkus.datasource.password=hangouthub
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/hangouthub

# ─── Hibernate ORM ────────────────────────────────────────────────────────────
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
quarkus.flyway.migrate-at-start=true

# ─── JWT ──────────────────────────────────────────────────────────────────────
# Run scripts/generate-dev-keys.sh once before starting the backend.
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=https://hangouthub.de
smallrye.jwt.sign.key.location=privateKey.pem

# ─── HTTP / CORS ──────────────────────────────────────────────────────────────
quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:5173
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.exposed-headers=location,content-disposition

# ─── OpenAPI / Swagger UI ─────────────────────────────────────────────────────
quarkus.smallrye-openapi.path=/api/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui

# ─── Dev profile ──────────────────────────────────────────────────────────────
%dev.quarkus.hibernate-orm.log.sql=false
%dev.quarkus.log.level=INFO
%dev.quarkus.log.category."de.hangouthub".level=DEBUG
