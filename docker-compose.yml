services:
  postgres:
    image: postgres:17-alpine
    container_name: hangouthub-postgres
    environment:
      POSTGRES_DB: hangouthub
      POSTGRES_USER: hangouthub
      POSTGRES_PASSWORD: hangouthub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hangouthub"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
